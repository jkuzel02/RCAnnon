name: rcannon

services:
  secrets-init:
    image: python:3.12-slim-bookworm
    container_name: rcannon-secrets-init
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    network_mode: none
    entrypoint:
      - python
      - /app/scripts/init-compose-secrets.py
    command: []
    volumes:
      - ./infrastructure/compose/scripts/init-compose-secrets.py:/app/scripts/init-compose-secrets.py:ro
      - ./infrastructure/compose/secrets:/seed-secrets:ro
      - rcannon_api_secrets:/out/api

  rcannon:
    image: ghcr.io/jkuzel02/rcannon:latest
    pull_policy: always
    container_name: rcannon
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    ports:
      - "127.0.0.1:${RCANNON_PORT:-8000}:8000"
    networks:
      - api_egress
      - telemetry_net
    volumes:
      - rcannon_api_data:/var/lib/rcannon
      - rcannon_api_secrets:/run/rcannon-secrets:ro
    environment:
      RCANNON_PROVIDER_MODE: ${RCANNON_PROVIDER_MODE:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      RCANNON_DB_PATH: /var/lib/rcannon/rcannon.db
      RCANNON_ALLOWED_SCOPES: ${RCANNON_ALLOWED_SCOPES:-{"lab":["demo"]}}
      RCANNON_UI_BEARER_TOKEN_FILE: /run/rcannon-secrets/rcannon_ui_bearer_token
      RCANNON_OPERATOR_BEARER_TOKEN_FILE: /run/rcannon-secrets/rcannon_operator_bearer_token
      RCANNON_SNAPSHOT_TTL_SECONDS: ${RCANNON_SNAPSHOT_TTL_SECONDS:-3600}
      RCANNON_MAX_SNAPSHOTS: ${RCANNON_MAX_SNAPSHOTS:-100}
      RCANNON_MAX_RUNS: ${RCANNON_MAX_RUNS:-500}
      RCANNON_MAX_WORKERS: ${RCANNON_MAX_WORKERS:-4}
      RCANNON_RUN_DEADLINE_SECONDS: ${RCANNON_RUN_DEADLINE_SECONDS:-90}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  api_egress:
    driver: bridge
  telemetry_net:
    driver: bridge
    internal: true

volumes:
  rcannon_api_data:
  rcannon_api_secrets:
