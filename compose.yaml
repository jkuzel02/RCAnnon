name: rcannon

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rcannon-api:local
    container_name: rcannon-api
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
    tmpfs:
      - /tmp:size=32m,noexec,nosuid,nodev
    networks:
      - ui_api
      - api_egress
      - telemetry_net
    volumes:
      - rcannon_api_data:/var/lib/rcannon
    secrets:
      - rcannon_ui_bearer_token
      - rcannon_operator_bearer_token
    environment:
      RCANNON_PROVIDER_MODE: ${RCANNON_PROVIDER_MODE:-mock}
      RCANNON_DB_PATH: /var/lib/rcannon/rcannon.db
      RCANNON_ALLOWED_SCOPES: ${RCANNON_ALLOWED_SCOPES:-{"lab":["demo"]}}
      RCANNON_UI_BEARER_TOKEN_FILE: /run/secrets/rcannon_ui_bearer_token
      RCANNON_OPERATOR_BEARER_TOKEN_FILE: /run/secrets/rcannon_operator_bearer_token
      RCANNON_SNAPSHOT_TTL_SECONDS: ${RCANNON_SNAPSHOT_TTL_SECONDS:-3600}
      RCANNON_MAX_SNAPSHOTS: ${RCANNON_MAX_SNAPSHOTS:-100}
      RCANNON_MAX_RUNS: ${RCANNON_MAX_RUNS:-500}
      RCANNON_MAX_WORKERS: ${RCANNON_MAX_WORKERS:-4}
      RCANNON_RUN_DEADLINE_SECONDS: ${RCANNON_RUN_DEADLINE_SECONDS:-90}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  ui:
    image: rcannon-api:local
    container_name: rcannon-ui
    depends_on:
      api:
        condition: service_healthy
    command:
      - --factory
      - rca.api.ui_stub:create_ui_app_from_env
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --timeout-graceful-shutdown
      - "15"
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    ports:
      - "127.0.0.1:${RCANNON_UI_PORT:-3080}:8080"
    networks:
      - ui_edge
      - ui_api
      - ui_db
    volumes:
      - rcannon_ui_data:/var/lib/rcannon-ui
    secrets:
      - rcannon_ui_bearer_token
    environment:
      RCANNON_API_URL: http://api:8000
      RCANNON_UI_BEARER_TOKEN_FILE: /run/secrets/rcannon_ui_bearer_token
      RCANNON_UI_STATE_PATH: /var/lib/rcannon-ui/state.json
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ui_edge:
    driver: bridge
  ui_api:
    driver: bridge
    internal: true
  ui_db:
    driver: bridge
    internal: true
  api_egress:
    driver: bridge
  telemetry_net:
    driver: bridge
    internal: true

volumes:
  rcannon_api_data:
  rcannon_ui_data:

secrets:
  rcannon_ui_bearer_token:
    file: ${RCANNON_UI_BEARER_TOKEN_SECRET_FILE:-./infrastructure/compose/secrets/ui_bearer_token.secret}
  rcannon_operator_bearer_token:
    file: ${RCANNON_OPERATOR_BEARER_TOKEN_SECRET_FILE:-./infrastructure/compose/secrets/operator_bearer_token.secret}
