[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rcannon"
version = "0.1.0"
description = "Kubernetes root cause analysis workflows and benchmark harness."
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23,<5",
    "langchain-openai>=0.3,<2",
    "langgraph>=0.4,<2",
    "openai>=1.60,<3",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["rca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
