services:
  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${RCANNON_KUBECONFIG_DIR:-./infrastructure/compose/kubeconfig}:/etc/rcannon/kubeconfig:ro
    environment:
      RCANNON_KUBECONFIG_PATH: /etc/rcannon/kubeconfig/${RCANNON_KUBECONFIG_FILE:-config}
      RCANNON_KUBE_CONTEXT: ${RCANNON_KUBE_CONTEXT:-kind-local}
      RCANNON_TARGET_ALIAS: ${RCANNON_TARGET_ALIAS:-lab}
