# Loaded only by try-rcannon.sh.
services:
  secrets-init:
    container_name: rcannon-demo-secrets-init
    volumes:
      - rcannon_demo_empty:/seed-secrets:ro

  rcannon:
    container_name: rcannon-demo-rcannon
    depends_on:
      demo:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RCANNON_DEMO_PORT:-8000}:8000"
    networks:
      - demo_api
    environment:
      RCANNON_PROVIDER_MODE: openai
      OPENAI_API_KEY: rcannon-local-demo-provider
      OPENAI_BASE_URL: http://demo:8081/v1
      OPENAI_MODEL: recorded-incident

  demo:
    image: python:3.12-slim-bookworm
    container_name: rcannon-demo-provider
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    entrypoint:
      - python
      - /demo/incident.py
    command: []
    networks:
      - demo_api
    volumes:
      - ./infrastructure/compose/scripts/demo-incident.py:/demo/incident.py:ro
      - ./scenarios/01/rca.json:/demo/case.json:ro
      - rcannon_api_secrets:/run/rcannon-secrets:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2)"
      interval: 2s
      timeout: 2s
      retries: 15

networks:
  demo_api:
    internal: true

volumes:
  rcannon_demo_empty:
