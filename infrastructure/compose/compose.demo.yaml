# Loaded only by try-rcannon.sh.
services:
  secrets-init:
    container_name: rcannon-demo-secrets-init
    volumes:
      - rcannon_demo_empty:/seed-secrets:ro

  librechat-secrets:
    container_name: rcannon-demo-librechat-secrets
    environment:
      LIBRECHAT_ADMIN_PASSWORD: rcannon-local-admin
    volumes:
      - rcannon_demo_empty:/seed-secrets:ro

  rcannon:
    container_name: rcannon-demo-rcannon
    depends_on:
      demo:
        condition: service_healthy
    networks:
      - demo_api
    environment:
      RCANNON_PROVIDER_MODE: openai
      OPENAI_API_KEY: rcannon-local-demo-provider
      OPENAI_BASE_URL: http://demo:8081/v1
      OPENAI_MODEL: recorded-incident

  mongodb:
    container_name: rcannon-demo-mongodb

  librechat-bootstrap:
    container_name: rcannon-demo-librechat-bootstrap
    environment:
      LIBRECHAT_ADMIN_EMAIL: admin@rcannon.local
      LIBRECHAT_ADMIN_USERNAME: rcannon-admin

  librechat:
    container_name: rcannon-demo-librechat

  demo:
    image: registry.librechat.ai/librechat-ai/librechat:v0.8.9@sha256:4a3967a47031c1fdba8302a6a341be7671101e40b617f7934ba25aac69fcea2b
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    entrypoint: [node, /demo/incident.mjs]
    command: []
    networks: [demo_api]
    volumes:
      - ./infrastructure/compose/scripts/demo-incident.mjs:/demo/incident.mjs:ro
      - ./scenarios/01/rca.json:/demo/case.json:ro
      - rcannon_api_secrets:/run/rcannon-secrets:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15

networks:
  demo_api:
    internal: true

volumes:
  rcannon_demo_empty:
