name: Workflow tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'rca/**'
      - 'prompts/**'
      - '.python-version'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version
      - run: uv run --with-requirements tests/requirements.txt pytest tests -rx
