name: English-only docs

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/scripts/check_english_docs.py'
      - '.github/scripts/test_check_english_docs.py'
      - '.github/scripts/requirements.txt'
      - '.github/workflows/english-only-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-english:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r .github/scripts/requirements.txt
      - name: Run English-only checker unit tests
        run: python -m unittest discover -s .github/scripts -v
      - name: Check changed Markdown files on pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python .github/scripts/check_english_docs.py --exclude docs/proposal.md --diff-base "origin/${BASE_REF}"
      - name: Check all English Markdown files on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          mapfile -t md_files < <(git ls-files '*.md')
          python .github/scripts/check_english_docs.py \
            --exclude docs/proposal.md \
            --exclude test_results/RCAnnon-protokol.md \
            "${md_files[@]}"
