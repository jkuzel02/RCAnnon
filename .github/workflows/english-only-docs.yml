name: English-only docs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-english:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qE '(\.md$|^\.github/scripts/|^\.github/workflows/english-only-docs\.yml$|^\.python-version$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Markdown or checker files changed; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version-file: .python-version
          enable-cache: true
      - name: Run English-only checker unit tests
        if: steps.changes.outputs.changed == 'true'
        run: uv run --no-project --with-requirements .github/scripts/requirements.txt python -m unittest discover -s .github/scripts -v
      - name: Check changed Markdown files on pull request
        if: github.event_name == 'pull_request' && steps.changes.outputs.changed == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run --no-project --with-requirements .github/scripts/requirements.txt python .github/scripts/check_english_docs.py --exclude docs/proposal.md --diff-base "origin/${BASE_REF}"
      - name: Check all English Markdown files on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          mapfile -t md_files < <(git ls-files '*.md')
          uv run --no-project --with-requirements .github/scripts/requirements.txt python .github/scripts/check_english_docs.py --exclude docs/proposal.md "${md_files[@]}"
